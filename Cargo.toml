[package]
name = "sssh"
version = "0.1.0"
edition = "2024"
description = "A simple SSH client library and CLI."
license = "MIT"
repository = "https://github.com/ahaoboy/sssh"
homepage = "https://github.com/ahaoboy/sssh"

[lib]
name = "sssh"

[[bin]]
name = "sssh"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
## Enable the `sssh` binary (depends on clap, crossterm, rpassword, …).
cli = ["dep:clap", "dep:crossterm", "dep:rpassword", "dep:tracing-subscriber"]

[dependencies]
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

# CLI-only dependencies (gated by the `cli` feature).
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
rpassword = { version = "7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
